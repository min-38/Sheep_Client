<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>서부 총잡이</title>
  </head>
  <body>
    <div id="game">
      <canvas id="screen" aria-label="게임 화면"></canvas>
      <div id="blood" aria-hidden="true" hidden></div>
      <div id="crosshair" aria-hidden="true"></div>
      <div id="flash" aria-hidden="true" hidden></div>
      <figure id="hit-card" aria-label="내 사격 결과" hidden>
        <!-- 정면 블록 몸(비율 A: 머리 8, 몸통 8×12, 팔과 다리 4×12). 키 32블록이 판정 원기둥의 머리 위 높이와 같음 -->
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <g class="figure">
            <rect x="37.5" y="0" width="25" height="25" />
            <rect x="37.5" y="25" width="25" height="37.5" />
            <rect x="25" y="25" width="12.5" height="37.5" />
            <rect x="62.5" y="25" width="12.5" height="37.5" />
            <rect x="37.5" y="62.5" width="12.5" height="37.5" />
            <rect x="50" y="62.5" width="12.5" height="37.5" />
          </g>
          <circle id="hit-hole" r="3.5" />
        </svg>
        <output id="hit-stamp"></output>
      </figure>
      <output id="ammo" aria-label="남은 총알"></output>
      <output id="banner" aria-label="판 신호"></output>
      <output id="room" aria-label="방 코드"></output>
      <div id="ready-bar" hidden>
        <button type="button" id="ready">준비</button>
        <output id="ready-count"></output>
      </div>
      <form id="lobby">
        <fieldset disabled>
          <button type="button" id="create">방 만들기</button>
          <input id="code" aria-label="방 코드" placeholder="방 코드" maxlength="6" pattern="[A-Za-z0-9]{6}" required autocomplete="off" spellcheck="false" />
          <button>입장</button>
        </fieldset>
        <p id="status" role="status">서버에 접속하는 중</p>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
