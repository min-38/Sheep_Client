<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="title"></title>
  </head>
  <body>
    <div id="game">
      <canvas id="screen" data-i18n-label="hud.screen"></canvas>
      <!-- 1인칭 화면 맨 위에 보이는 내 모자 챙 (SHEEP-159). 색과 크기는 main.ts가 그 시점 주인의 모자로 정함 -->
      <div id="brim" aria-hidden="true" hidden></div>
      <!-- 걷는 동안 화면 가장자리 어둠 (SHEEP-141). 짙기와 좁혀 들어오는 정도는 main.ts가 박동에 맞춰 바꿈 -->
      <div id="tension" hidden></div>
      <div id="blood" aria-hidden="true" hidden></div>
      <div id="crosshair" class="reticle" aria-hidden="true" hidden></div>
      <div id="flash" aria-hidden="true" hidden></div>
      <figure id="hit-card" data-i18n-label="hud.hitCard" hidden>
        <!-- 정면 블록 몸(7.5등신 틀, 시스템 기획서 캐릭터: 머리, 목, 몸통, 팔, 다리). 키 30블록이 판정 원기둥의 머리 위 높이와 같음 -->
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <g class="figure">
            <rect x="45" y="0" width="10" height="13.333" />
            <rect x="46.667" y="13.333" width="6.667" height="3.333" />
            <rect x="40" y="16.667" width="20" height="30" />
            <rect x="33.333" y="16.667" width="6.667" height="43.333" />
            <rect x="60" y="16.667" width="6.667" height="43.333" />
            <rect x="40.833" y="46.667" width="8.333" height="53.333" />
            <rect x="50.833" y="46.667" width="8.333" height="53.333" />
          </g>
          <!-- 총알에 뚫린 구멍 (SHEEP-154, 시안 A). 그을린 둘레, 찢긴 구멍, 바깥으로 젖혀진 종이 두 쪽. 자리는 main.ts가 transform으로 옮김 -->
          <g id="hit-hole">
            <circle class="scorch" r="5" />
            <polygon class="hole" points="-3,-1 -1,-3.4 1.6,-2.6 3.2,-0.4 2.4,2.6 -0.4,3.2 -2.8,2" />
            <polygon class="flap" points="-3,-1 -5,-2.4 -2.4,-2.2" />
            <polygon class="flap" points="2.4,2.6 4.6,3.8 3.4,1.4" />
          </g>
        </svg>
        <output id="hit-stamp"></output>
      </figure>
      <!-- 쓰러지는 장면의 자막 카드. 누가 어디를 맞혀 나를 쓰러뜨렸는지 무성 영화 자막처럼 띄움 (시스템 기획서 HUD 쓰러짐, SHEEP-119) -->
      <figure id="kill-card" data-i18n-label="hud.killCard" hidden>
        <img id="kill-face" alt="" />
        <span class="who">
          <span id="kill-kicker"></span>
          <span id="kill-name"></span>
        </span>
        <!-- 사격 결과 카드와 같은 정면 블록 몸. 구멍 자리는 main.ts가 맞은 부위로 옮김 -->
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <g class="figure">
            <rect x="45" y="0" width="10" height="13.333" />
            <rect x="46.667" y="13.333" width="6.667" height="3.333" />
            <rect x="40" y="16.667" width="20" height="30" />
            <rect x="33.333" y="16.667" width="6.667" height="43.333" />
            <rect x="60" y="16.667" width="6.667" height="43.333" />
            <rect x="40.833" y="46.667" width="8.333" height="53.333" />
            <rect x="50.833" y="46.667" width="8.333" height="53.333" />
          </g>
          <circle id="kill-old" r="3.5" />
          <circle id="kill-hole" r="4" />
        </svg>
        <figcaption id="kill-line"></figcaption>
      </figure>
      <!-- 리볼버 실린더 6칸. 그림은 cylinder.ts가 채우고, 장전된 칸만 놋쇠 탄피 바닥이 보임 (시스템 기획서 HUD 탄 수) -->
      <svg id="ammo" viewBox="0 0 100 100" role="img"></svg>
      <output id="timer" data-i18n-label="hud.timer" hidden></output>
      <output id="alive" data-i18n-label="hud.alive" hidden></output>
      <output id="banner" data-i18n-label="hud.banner"></output>
      <!-- 총을 뽑으라는 안내 (SHEEP-138). "시작!"부터 D로 뽑을 때까지 큰 글자 바로 아래 한 줄. 글 사이에 D 키 모양 -->
      <p id="draw-hint" hidden><kbd>D</kbd></p>
      <!-- 판 도중 포인터가 잠기지 않았을 때 화면을 누르라는 안내 (SHEEP-152). 뽑기 안내와 같은 모양으로 조준점 아래 -->
      <p id="lock-hint" data-i18n="hud.lockHint" hidden></p>
      <output id="watching" data-i18n-label="hud.watching" hidden></output>
      <button type="button" id="replay" class="plank" data-i18n="hud.replay" hidden></button>
      <button type="button" id="leave-down" class="plank" data-i18n="hud.leave" hidden></button>
      <output id="room" data-i18n-label="hud.roomCode"></output>
      <!-- 판 끝 결과 보드 (SHEEP-187 시안 A). 이긴 사람이 석양으로 걸어가는 동안 그 위에 얹음. 보는 사람 자신의 것:
           왼쪽 위에 못으로 박은 내 WANTED 포스터와 도장(이긴 사람 WINNER, 진 사람 DEAD), 오른쪽 위 하늘에 서부 문구, 잔고(이긴 사람만 +$100이 붙어 세어 올라감), 킬 수.
           각 칸은 main.ts가 걷기 시각에 맞춰 on을 붙여 차례로 띄우고, 도장과 흙먼지 고리는 CSS 애니메이션으로 움직임.
           걷는 사람 머리 위에는 보안관 별을 단 이긴 사람 닉네임을 띄움 -->
      <div id="ending" data-i18n-label="hud.endBoard" role="group" hidden>
        <div id="end-dim"></div>
        <p id="walker-name"><span class="star" aria-hidden="true">★</span><span id="walker-nick"></span></p>
        <div class="poster" id="end-poster" data-k="poster">
          <span class="wanted">WANTED</span>
          <img id="end-face" alt="" />
          <span class="nick" id="end-name"></span>
          <span class="stamp" id="end-stamp" data-k="stamp"></span>
          <span class="dust" data-k="hit" aria-hidden="true"></span>
        </div>
        <div id="end-board">
          <p id="end-line" data-k="phrase"></p>
          <p id="end-money" data-k="money"><span id="end-plus" data-k="plus"></span><b id="end-balance"></b></p>
          <p id="end-kills" data-k="kills"></p>
        </div>
        <div id="end-fade"></div>
      </div>
      <!-- 술집 대기실. 방에 들어가 판이 시작되기 전과 판이 끝난 뒤에 보임. 벽, 선반, 카운터, 술집 주인, 바 의자와 앉은 사람은 캔버스에 그리고
           글자가 있는 것만 여기 얹음 (시스템 기획서 방 화면 M8 대기실 짜임) -->
      <div id="saloon" hidden>
        <!-- 술장 위 방 이름 간판. 판은 saloon.ts가 그리고 금박 글씨만 얹음. 길면 …로 자름 (SHEEP-168 시안 B) -->
        <p id="saloon-sign"></p>
        <!-- 바 좌석 꼬리표. 좌석 수는 방 인원 제한이고 서버가 준 좌석 번호(seat)에 앉음. 칸은 main.ts가 방에 들어갈 때 만듦 -->
        <ol id="seats" data-i18n-label="saloon.seats"></ol>
        <!-- 술집 주인 말풍선. 가끔 팁이나 농담을 무성 영화 자막처럼 머리 위에 띄움. 자리는 main.ts가 술집 주인을 따라 옮김 -->
        <p id="bartender-line" hidden></p>
        <!-- 칠판에는 방 코드만 적음 (SHEEP-170) -->
        <div id="chalkboard" data-i18n-label="saloon.board">
          <!-- 방 코드. 누르면 클립보드에 복사함. 옆의 종이 두 장 아이콘이 복사할 수 있다는 표시 (SHEEP-114) -->
          <button type="button" id="board-code" data-i18n-label="saloon.copyCode"><span id="board-code-text"></span><i class="copy-icon" aria-hidden="true"></i></button>
          <p id="board-copied" role="status" hidden></p>
          <p id="board-private" data-i18n="saloon.private" hidden></p>
        </div>
        <!-- 칠판 아래 못 박은 나무 판 버튼. 준비, 캐릭터 변경, 설정, 나가기 차례로 두 줄. 8명 방의 오른쪽 좌석 꼬리표에 걸리지 않게 두 줄로 둠
             (사용자 결정 2026-11-11, SHEEP-170 시안 B) -->
        <div id="board-buttons">
          <button type="button" id="ready" class="plank"></button>
          <button type="button" id="dress-open" class="plank" data-i18n="saloon.changeCharacter" aria-controls="wardrobe" aria-expanded="false"></button>
          <button type="button" class="plank settings-open" data-i18n="saloon.settings"></button>
          <button type="button" id="leave" class="plank" data-i18n="saloon.leave"></button>
        </div>
        <!-- 캐릭터·색 고르기 판. 캐릭터 변경 버튼을 누르면 칠판 왼쪽에 펼침. 캐릭터마다 작은 WANTED 포스터, 그 아래 핵심 파츠 이름과 사람 색 견본.
             단추는 main.ts가 만듦 (시스템 기획서 방 화면 캐릭터·색 바꾸기, SHEEP-118, SHEEP-170). 다른 것 위에 오게 맨 뒤에 둠 -->
        <div id="wardrobe" role="group" data-i18n-label="saloon.wardrobe" hidden>
          <div id="wanted"></div>
          <p id="wardrobe-part"></p>
          <div id="swatches"></div>
        </div>
      </div>
      <!-- 첫 화면. 닉네임 단계, 메뉴, 입장 게시판 중 하나를 보임. 어느 것인지는 main.ts가 data-view로 알림
           (시스템 기획서 방 화면 M8 첫 화면, 첫 화면 흐름) -->
      <form id="lobby">
        <h1 id="title"><span data-i18n="titleLines.0"></span> <span data-i18n="titleLines.1"></span> <span data-i18n="titleLines.2"></span></h1>
        <!-- 1단계: 닉네임을 정함. 브라우저에 기억한 닉네임이 있으면 건너뜀 -->
        <fieldset id="name-step" disabled>
          <input id="nickname" data-i18n-label="lobby.nickname" aria-describedby="nickname-rule" data-i18n-placeholder="lobby.nickname" maxlength="12" autocomplete="nickname" spellcheck="false" />
          <p id="nickname-rule" data-i18n="lobby.nicknameRule"></p>
          <button id="name-ok" class="plank" data-i18n="lobby.ok"></button>
        </fieldset>
        <!-- 메뉴: 나무 기둥에 박은 이정표 판. 연습은 방 밖에서 혼자 과녁을 쏨 (SHEEP-195). 브라우저는 연 탭을 닫지 못해 종료는 없음 -->
        <div id="menu" hidden>
          <button type="button" id="enter" class="plank sign" data-i18n="lobby.play"></button>
          <button type="button" id="practice" class="plank sign left" data-i18n="lobby.practice"></button>
          <button type="button" id="help-open" class="plank sign" data-i18n="lobby.help" aria-controls="help-panel"></button>
          <button type="button" class="plank sign settings-open" data-i18n="lobby.settings"></button>
        </div>
        <!-- 입장 게시판: 못 박은 종이. 머리에 방 만들기, 그 아래 방 목록, 맨 아래 뒤로·방 코드·입장. 캐릭터는 술집에서 고름 (SHEEP-118) -->
        <fieldset id="room-step" class="sheet" hidden disabled>
          <div id="board-head">
            <h2 data-i18n="lobby.rooms"></h2>
            <button type="button" id="create" class="plank" data-i18n="lobby.create"></button>
          </div>
          <!-- 줄은 main.ts가 만듦. 들어갈 수 있는 줄은 눌러 고르고(방 코드 칸에 코드가 들어감) 두 번 눌러 들어감 -->
          <ul id="room-list" data-i18n-label="lobby.roomList"></ul>
          <p id="room-hint" data-i18n="lobby.doubleClick"></p>
          <div class="row">
            <button type="button" id="back" class="plank" data-i18n="lobby.back"></button>
            <input id="code" data-i18n-label="lobby.code" data-i18n-placeholder="lobby.code" maxlength="6" pattern="[A-Za-z0-9]{6}" required autocomplete="off" spellcheck="false" />
            <button id="join" class="plank" data-i18n="lobby.join"></button>
          </div>
        </fieldset>
        <p id="status" role="status"></p>
      </form>
      <!-- 방 만들기 창. 방 이름, 인원 제한, 비공개 여부를 정해 생성하거나 취소함 (시스템 기획서 방 화면 방 만들기 창) -->
      <div id="create-panel" role="dialog" aria-modal="true" aria-labelledby="create-title" hidden>
        <form id="create-form" class="sheet">
          <h2 id="create-title" data-i18n="lobby.create"></h2>
          <div class="row">
            <input id="room-name" data-i18n-label="create.name" aria-describedby="room-name-rule" data-i18n-placeholder="create.name" maxlength="64" autocomplete="off" spellcheck="false" />
            <button type="button" id="dice" class="plank" data-i18n-label="create.dice.label">🎲</button>
          </div>
          <p id="room-name-rule" data-i18n="create.rule" hidden></p>
          <label class="row">
            <span id="max-players-label" data-i18n="create.players"></span>
            <select id="max-players">
              <option>2</option>
              <option>3</option>
              <option>4</option>
              <option>5</option>
              <option>6</option>
              <option>7</option>
              <option selected>8</option>
            </select>
          </label>
          <label id="private-box"><input type="checkbox" id="private" /> <span data-i18n="saloon.private"></span></label>
          <div class="row">
            <button id="create-ok" class="plank" data-i18n="create.ok"></button>
            <button type="button" id="create-cancel" class="plank" data-i18n="create.cancel"></button>
          </div>
        </form>
      </div>
      <!-- Esc 메뉴 (시스템 기획서 HUD Esc 메뉴, SHEEP-199). 판(술집 밖)과 연습에서 Esc로 포인터 잠금이 풀리면 띄움. 사용자가 준 참고 그림처럼
           폭 넓은 돌아가기 판 아래 줄에 설정과 나가기를 반씩 둠. 설정 창이 그 위에 뜨게 설정 창보다 앞에 둠 -->
      <div id="pause" role="dialog" aria-modal="true" data-i18n-label="pause.menu" hidden>
        <div id="pause-buttons">
          <button type="button" id="pause-resume" class="plank" data-i18n="pause.resume"></button>
          <button type="button" class="plank settings-open" data-i18n="lobby.settings"></button>
          <button type="button" id="pause-leave" class="plank" data-i18n="hud.leave"></button>
        </div>
      </div>
      <!-- 설정 창. 첫 화면과 대기실에서 같은 판을 띄움. 바꾸면 바로 적용하고 브라우저에 기억함 (시스템 기획서 방 화면 설정) -->
      <div id="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
        <form id="settings-form" class="sheet">
          <h2 id="settings-title" data-i18n="lobby.settings"></h2>
          <!-- 닉네임. 첫 화면에서 연 설정에만 보임. 방 안에서는 이름을 바꾸지 않음 (시스템 기획서 방 화면 설정) -->
          <div id="settings-name">
            <label class="row">
              <span data-i18n="lobby.nickname"></span>
              <input id="settings-nickname" aria-describedby="settings-nickname-rule" maxlength="12" autocomplete="nickname" spellcheck="false" />
            </label>
            <p id="settings-nickname-rule" data-i18n="lobby.nicknameRule"></p>
          </div>
          <!-- 언어 목록은 main.ts가 언어마다 그 언어로 쓴 이름으로 채움 -->
          <label class="row">
            <span id="language-label" data-i18n="settings.language"></span>
            <select id="language"></select>
          </label>
          <label class="row">
            <span data-i18n="settings.music"></span>
            <input type="range" id="music" min="0" max="100" step="5" />
            <output id="music-value"></output>
          </label>
          <label class="row">
            <span data-i18n="settings.effects"></span>
            <input type="range" id="effects" min="0" max="100" step="5" />
            <output id="effects-value"></output>
          </label>
          <div class="row" role="radiogroup" data-i18n-label="settings.hand">
            <span data-i18n="settings.hand"></span>
            <!-- 라디오는 숨기고 나무 판 둘을 누름. 고른 판은 놋쇠 테에 눌려 내려앉음 (SHEEP-162, 시안 B). 왼쪽에 왼손, 오른쪽에 오른손 (SHEEP-174) -->
            <label class="hand-choice"><input type="radio" name="hand" value="left" /><span class="hand-plank" data-i18n="settings.left"></span></label>
            <label class="hand-choice"><input type="radio" name="hand" value="right" /><span class="hand-plank" data-i18n="settings.right"></span></label>
          </div>
          <!-- 조준점 모양. 칸마다 결투 화면과 같은 그림. 이름은 칸 아래에 적지 않고 aria-label로만 둠. 칸은 손 판처럼 이름 칸 바로 뒤부터 붙임 (시스템 기획서 HUD 조준점, 시안 B, SHEEP-185) -->
          <div class="row" role="radiogroup" aria-labelledby="crosshair-label">
            <span id="crosshair-label" data-i18n="settings.crosshair"></span>
            <label class="reticle-choice"><input type="radio" name="crosshair" value="ringDot" data-i18n-label="settings.ringDot" /><span class="reticle-tile"><span class="reticle" data-shape="ringDot"></span></span></label>
            <label class="reticle-choice"><input type="radio" name="crosshair" value="cross" data-i18n-label="settings.cross" /><span class="reticle-tile"><span class="reticle" data-shape="cross"></span></span></label>
            <label class="reticle-choice"><input type="radio" name="crosshair" value="dot" data-i18n-label="settings.dot" /><span class="reticle-tile"><span class="reticle" data-shape="dot"></span></span></label>
            <label class="reticle-choice"><input type="radio" name="crosshair" value="ring" data-i18n-label="settings.ring" /><span class="reticle-tile"><span class="reticle" data-shape="ring"></span></span></label>
          </div>
          <button id="settings-close" class="plank" data-i18n="settings.close"></button>
        </form>
      </div>
      <!-- 도움말 창. 메뉴의 도움말을 누르면 설정 창처럼 띄움. 장마다 글자를 숨긴 게임 그림 한 장과 한 줄. 이전·다음으로 넘기고 닫기나 Esc로 메뉴로 돌아감
           (시스템 기획서 방 화면 도움말, SHEEP-196 시안 A). 그림, 글, 장 번호는 main.ts가 넣음 -->
      <div id="help-panel" role="dialog" aria-modal="true" aria-labelledby="help-title" hidden>
        <div class="sheet">
          <h2 id="help-title" data-i18n="lobby.help"></h2>
          <img id="help-picture" alt="" />
          <p id="help-line" aria-live="polite"></p>
          <div class="row">
            <button type="button" id="help-prev" class="plank" data-i18n="help.prev"></button>
            <output id="help-count"></output>
            <button type="button" id="help-next" class="plank" data-i18n="help.next"></button>
          </div>
          <button type="button" id="help-close" class="plank" data-i18n="settings.close"></button>
        </div>
      </div>
      <!-- 연습에 들어가고 나갈 때 화면을 검게 덮었다 걷는 막 (SHEEP-198). 모든 것 위에 둬 그동안 누르기를 막음 -->
      <div id="fade" aria-hidden="true" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
