<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>서부 총잡이</title>
  </head>
  <body>
    <div id="game">
      <canvas id="screen" aria-label="게임 화면"></canvas>
      <div id="blood" aria-hidden="true" hidden></div>
      <div id="crosshair" aria-hidden="true"></div>
      <div id="flash" aria-hidden="true" hidden></div>
      <figure id="hit-card" aria-label="내 사격 결과" hidden>
        <!-- 정면 블록 몸(비율 A: 머리 8, 몸통 8×12, 팔과 다리 4×12). 키 32블록이 판정 원기둥의 머리 위 높이와 같음 -->
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <g class="figure">
            <rect x="37.5" y="0" width="25" height="25" />
            <rect x="37.5" y="25" width="25" height="37.5" />
            <rect x="25" y="25" width="12.5" height="37.5" />
            <rect x="62.5" y="25" width="12.5" height="37.5" />
            <rect x="37.5" y="62.5" width="12.5" height="37.5" />
            <rect x="50" y="62.5" width="12.5" height="37.5" />
          </g>
          <circle id="hit-hole" r="3.5" />
        </svg>
        <output id="hit-stamp"></output>
      </figure>
      <!-- 리볼버 실린더 6칸. 장전된 칸만 금색 (시스템 기획서 HUD 탄 수). 첫 칸이 맨 위이고 시계 방향 -->
      <svg id="ammo" viewBox="0 0 100 100" role="img" aria-label="남은 총알">
        <circle class="cylinder" cx="50" cy="50" r="46" />
        <circle class="chamber" cx="50" cy="22" r="10" />
        <circle class="chamber" cx="74.2" cy="36" r="10" />
        <circle class="chamber" cx="74.2" cy="64" r="10" />
        <circle class="chamber" cx="50" cy="78" r="10" />
        <circle class="chamber" cx="25.8" cy="64" r="10" />
        <circle class="chamber" cx="25.8" cy="36" r="10" />
        <circle class="pin" cx="50" cy="50" r="6" />
      </svg>
      <output id="timer" aria-label="남은 시간" hidden></output>
      <output id="banner" aria-label="판 신호"></output>
      <output id="room" aria-label="방 코드"></output>
      <div id="ready-bar" hidden>
        <button type="button" id="ready">준비</button>
        <output id="ready-count"></output>
      </div>
      <!-- 첫 화면. 위에서부터 제목, 닉네임, 랜덤 입장, 방 만들기, 방 코드로 입장 (시스템 기획서 방 화면 M8 첫 화면) -->
      <form id="lobby">
        <h1 id="title">서부 총잡이</h1>
        <fieldset disabled>
          <input id="nickname" aria-label="닉네임" aria-describedby="nickname-rule" placeholder="닉네임" maxlength="12" autocomplete="nickname" spellcheck="false" />
          <p id="nickname-rule" hidden>2~8자, 한글·영문·숫자만</p>
          <button type="button" id="quick" class="plank">랜덤 입장</button>
          <div class="row">
            <button type="button" id="create" class="plank">방 만들기</button>
            <label id="private-box"><input type="checkbox" id="private" /> 비공개</label>
          </div>
          <div class="row">
            <input id="code" aria-label="방 코드" placeholder="방 코드" maxlength="6" pattern="[A-Za-z0-9]{6}" required autocomplete="off" spellcheck="false" />
            <button id="join" class="plank">입장</button>
          </div>
        </fieldset>
        <p id="status" role="status">서버에 접속하는 중</p>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
