<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>서부 총잡이</title>
  </head>
  <body>
    <div id="game">
      <canvas id="screen" aria-label="게임 화면"></canvas>
      <div id="blood" aria-hidden="true" hidden></div>
      <div id="crosshair" aria-hidden="true"></div>
      <div id="flash" aria-hidden="true" hidden></div>
      <figure id="hit-card" aria-label="내 사격 결과" hidden>
        <!-- 정면 블록 몸(비율 A: 머리 8, 몸통 8×12, 팔과 다리 4×12). 키 32블록이 판정 원기둥의 머리 위 높이와 같음 -->
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <g class="figure">
            <rect x="37.5" y="0" width="25" height="25" />
            <rect x="37.5" y="25" width="25" height="37.5" />
            <rect x="25" y="25" width="12.5" height="37.5" />
            <rect x="62.5" y="25" width="12.5" height="37.5" />
            <rect x="37.5" y="62.5" width="12.5" height="37.5" />
            <rect x="50" y="62.5" width="12.5" height="37.5" />
          </g>
          <circle id="hit-hole" r="3.5" />
        </svg>
        <output id="hit-stamp"></output>
      </figure>
      <!-- 리볼버 실린더 6칸. 장전된 칸만 금색 (시스템 기획서 HUD 탄 수). 첫 칸이 맨 위이고 시계 방향 -->
      <svg id="ammo" viewBox="0 0 100 100" role="img" aria-label="남은 총알">
        <circle class="cylinder" cx="50" cy="50" r="46" />
        <circle class="chamber" cx="50" cy="22" r="10" />
        <circle class="chamber" cx="74.2" cy="36" r="10" />
        <circle class="chamber" cx="74.2" cy="64" r="10" />
        <circle class="chamber" cx="50" cy="78" r="10" />
        <circle class="chamber" cx="25.8" cy="64" r="10" />
        <circle class="chamber" cx="25.8" cy="36" r="10" />
        <circle class="pin" cx="50" cy="50" r="6" />
      </svg>
      <output id="timer" aria-label="남은 시간" hidden></output>
      <output id="banner" aria-label="판 신호"></output>
      <output id="room" aria-label="방 코드"></output>
      <!-- 술집 대기실. 방에 들어가 판이 시작되기 전과 판이 끝난 뒤에 보임. 벽, 선반, 카운터, 술집 주인은 캔버스에 그리고
           글자가 있는 것만 여기 얹음 (시스템 기획서 방 화면 M8 대기실 짜임) -->
      <div id="saloon" hidden>
        <!-- 왼쪽 벽 포스터 8자리. 목수건 색 번호가 자리 번호 -->
        <ol id="posters" aria-label="방에 있는 사람"></ol>
        <div id="chalkboard" aria-label="방">
          <p id="board-name"></p>
          <p id="board-code"></p>
          <p id="board-private" hidden>비공개</p>
        </div>
        <!-- 카운터 앞면. 왼쪽부터 나가기, 준비, 설정 -->
        <div id="counter">
          <button type="button" id="leave" class="plank">나가기</button>
          <div id="ready-box">
            <button type="button" id="ready" class="plank">준비</button>
            <output id="ready-count"></output>
          </div>
          <button type="button" class="plank settings-open">설정</button>
        </div>
      </div>
      <!-- 첫 화면. 위에서부터 제목, 닉네임, 랜덤 입장, 방 만들기, 방 코드로 입장 (시스템 기획서 방 화면 M8 첫 화면) -->
      <form id="lobby">
        <h1 id="title">서부 총잡이</h1>
        <!-- 1단계: 닉네임을 정함. 브라우저에 기억한 닉네임이 있으면 건너뜀 -->
        <fieldset id="name-step" disabled>
          <input id="nickname" aria-label="닉네임" aria-describedby="nickname-rule" placeholder="닉네임" maxlength="12" autocomplete="nickname" spellcheck="false" />
          <p id="nickname-rule">2~8자, 한글·영문·숫자만</p>
          <button id="name-ok" class="plank">확인</button>
        </fieldset>
        <!-- 2단계: 방 목록, 그 아래 방 코드로 입장, 랜덤 입장, 방 만들기 (시스템 기획서 방 화면 첫 화면) -->
        <fieldset id="room-step" hidden disabled>
          <p id="who">닉네임 <strong id="who-name"></strong> <button type="button" id="rename">바꾸기</button></p>
          <ul id="room-list" aria-label="방 목록"></ul>
          <div class="row">
            <input id="code" aria-label="방 코드" placeholder="방 코드" maxlength="6" pattern="[A-Za-z0-9]{6}" required autocomplete="off" spellcheck="false" />
            <button id="join" class="plank">입장</button>
          </div>
          <div class="row">
            <button type="button" id="quick" class="plank">랜덤 입장</button>
            <button type="button" id="create" class="plank">방 만들기</button>
          </div>
        </fieldset>
        <button type="button" class="plank settings-open">설정</button>
        <p id="status" role="status">서버에 접속하는 중</p>
      </form>
      <!-- 방 만들기 창. 방 이름, 인원 제한, 비공개 여부를 정해 생성하거나 취소함 (시스템 기획서 방 화면 방 만들기 창) -->
      <div id="create-panel" role="dialog" aria-modal="true" aria-labelledby="create-title" hidden>
        <form id="create-form" class="sheet">
          <h2 id="create-title">방 만들기</h2>
          <div class="row">
            <input id="room-name" aria-label="방 이름" aria-describedby="room-name-rule" placeholder="방 이름" maxlength="64" autocomplete="off" spellcheck="false" />
            <button type="button" id="dice" class="plank" aria-label="무작위 이름">🎲</button>
          </div>
          <p id="room-name-rule" hidden>2~16자</p>
          <label class="row">
            <span>인원</span>
            <select id="max-players">
              <option>2</option>
              <option>3</option>
              <option>4</option>
              <option>5</option>
              <option>6</option>
              <option>7</option>
              <option selected>8</option>
            </select>
          </label>
          <label id="private-box"><input type="checkbox" id="private" /> 비공개</label>
          <div class="row">
            <button id="create-ok" class="plank">생성</button>
            <button type="button" id="create-cancel" class="plank">취소</button>
          </div>
        </form>
      </div>
      <!-- 설정 창. 첫 화면과 대기실에서 같은 판을 띄움. 바꾸면 바로 적용하고 브라우저에 기억함 (시스템 기획서 방 화면 설정) -->
      <div id="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
        <form id="settings-form" class="sheet">
          <h2 id="settings-title">설정</h2>
          <label class="row">
            <span>감도</span>
            <input type="range" id="sensitivity" min="25" max="400" step="5" />
            <output id="sensitivity-value"></output>
          </label>
          <label class="row">
            <span>배경음악</span>
            <input type="range" id="music" min="0" max="100" step="5" />
            <output id="music-value"></output>
          </label>
          <label class="row">
            <span>효과음</span>
            <input type="range" id="effects" min="0" max="100" step="5" />
            <output id="effects-value"></output>
          </label>
          <div class="row" role="radiogroup" aria-label="총을 든 손">
            <span>총을 든 손</span>
            <label><input type="radio" name="hand" value="right" /> 오른손</label>
            <label><input type="radio" name="hand" value="left" /> 왼손</label>
          </div>
          <button id="settings-close" class="plank">닫기</button>
        </form>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
