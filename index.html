<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>서부 총잡이</title>
  </head>
  <body>
    <div id="game">
      <canvas id="screen" aria-label="게임 화면"></canvas>
      <div id="crosshair" aria-hidden="true"></div>
      <output id="ammo" aria-label="남은 총알"></output>
      <output id="room" aria-label="방 코드"></output>
      <form id="lobby">
        <fieldset disabled>
          <button type="button" id="create">방 만들기</button>
          <input id="code" aria-label="방 코드" placeholder="방 코드" maxlength="6" pattern="[A-Za-z0-9]{6}" required autocomplete="off" spellcheck="false" />
          <button>입장</button>
        </fieldset>
        <p id="status" role="status">서버에 접속하는 중</p>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
